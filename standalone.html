    function cleanNumber(val) {
      if (val === null || val === undefined) return 0;
      if (typeof val === 'number') return isNaN(val) ? 0 : val;
      let str = String(val).trim();
      if (str === '' || str === '--' || str === '-' || str === 'N/A') return 0;
      str = str.replace(/[$,€£₹¥\s"']/g, '');
      if (str.endsWith('%')) str = str.slice(0, -1);
      str = str.replace(/^[<>~]/, '');
      const parsed = parseFloat(str);
      return isNaN(parsed) ? 0 : parsed;
    }

    function parseGoogleAdsCSVText(csvText) {
      return new Promise((resolve, reject) => {
        Papa.parse(csvText, {
          skipEmptyLines: 'greedy',
          complete: (results) => {
            const rawData = results.data;
            if (!rawData || rawData.length === 0) return reject(new Error('Empty CSV file'));

            let headerIdx = 0;
            for (let i = 0; i < Math.min(rawData.length, 10); i++) {
              const rowStr = rawData[i].map(c => String(c).toLowerCase()).join(' ');
              if (rowStr.includes('search term') || rowStr.includes('query')) {
                headerIdx = i;
                break;
              }
            }

            const headers = rawData[headerIdx].map(h => String(h || '').trim().toLowerCase());
            const queryIdx = headers.findIndex(h => h.includes('search term') || h.includes('query'));
            const costIdx = headers.findIndex(h => h.includes('cost') || h.includes('spend'));
            const clicksIdx = headers.findIndex(h => h.includes('clicks'));
            const imprIdx = headers.findIndex(h => h.includes('impr'));
            const convIdx = headers.findIndex(h => h.includes('conversion') || h.includes('conv.') || h.includes('conv'));
            const cpaIdx = headers.findIndex(h => h.includes('cost / conv') || h.includes('cpa'));
            const convValIdx = headers.findIndex(h => h.includes('conv. value') || h.includes('revenue') || h.includes('value'));
            const matchIdx = headers.findIndex(h => h.includes('match type'));
            const campIdx = headers.findIndex(h => h.includes('campaign'));
            const adgIdx = headers.findIndex(h => h.includes('ad group'));

            const rows = [];
            for (let i = headerIdx + 1; i < rawData.length; i++) {
              const r = rawData[i];
              const query = queryIdx !== -1 && r[queryIdx] ? String(r[queryIdx]).trim() : '';
              if (!query || query.toLowerCase().startsWith('total:') || query.toLowerCase().startsWith('total')) continue;

              const cost = cleanNumber(costIdx !== -1 ? r[costIdx] : 0);
              const clicks = cleanNumber(clicksIdx !== -1 ? r[clicksIdx] : 0);
              const impressions = cleanNumber(imprIdx !== -1 ? r[imprIdx] : 0);
              const conversions = cleanNumber(convIdx !== -1 ? r[convIdx] : 0);
              const conversionValue = cleanNumber(convValIdx !== -1 ? r[convValIdx] : 0);
              const cpa = conversions > 0 ? (cpaIdx !== -1 && cleanNumber(r[cpaIdx]) > 0 ? cleanNumber(r[cpaIdx]) : cost / conversions) : null;
              const ctr = impressions > 0 ? (clicks / impressions) * 100 : 0;
              const avgCpc = clicks > 0 ? cost / clicks : 0;
              const convRate = clicks > 0 ? (conversions / clicks) * 100 : 0;
              const roas = cost > 0 ? conversionValue / cost : 0;

              rows.push({
                id: `q-${i}-${query.slice(0, 10).replace(/\s+/g, '_')}`,
                query,
                cost,
                clicks,
                impressions,
                conversions,
                conversionValue,
                cpa,
                ctr,
                avgCpc,
                convRate,
                roas,
                matchType: matchIdx !== -1 && r[matchIdx] ? r[matchIdx] : 'Broad',
                campaign: campIdx !== -1 && r[campIdx] ? r[campIdx] : 'Search Campaign',
                adGroup: adgIdx !== -1 && r[adgIdx] ? r[adgIdx] : 'Default Ad Group',
              });
            }
            resolve(rows);
          },
          error: reject
        });
      });
    }

    function triageSingle(row, config) {
      if (row.userOverride) {
        return {
          status: row.userOverride,
          rule: 'Manual Override',
          reason: `Manually set by user to ${row.userOverride.toUpperCase()}`,
          urgencyScore: row.userOverride === 'promote' ? 85 : row.userOverride === 'block' ? -85 : 0,
          overridden: true,
        };
      }

      const q = row.query.toLowerCase();
      // Check negative stopword
      const matchedStopword = config.negativeStopwords.find(w => new RegExp(`(^|\\b)${w}(\\b|$)`, 'i').test(q));
      if (matchedStopword && row.conversions === 0) {
        return {
          status: TRIAGE_STATUS.BLOCK,
          rule: 'Negative Stopword Match',
          reason: `Contains stopword "${matchedStopword}" with 0 conversions ($${row.cost.toFixed(2)} spent)`,
          urgencyScore: -75,
        };
      }

      // Bleeder spend
      if (row.conversions === 0 && row.cost >= config.bleederSpendThreshold) {
        return {
          status: TRIAGE_STATUS.BLOCK,
          rule: 'Bleeder: Zero Conversions',
          reason: `$${row.cost.toFixed(2)} spent with 0 conversions (Threshold: $${config.bleederSpendThreshold})`,
          urgencyScore: -85,
        };
      }

      // Click burner
      if (row.conversions === 0 && row.clicks >= config.maxClicksWithoutConversion) {
        return {
          status: TRIAGE_STATUS.BLOCK,
          rule: 'Click Burner',
          reason: `${row.clicks} clicks with 0 conversions (Max: ${config.maxClicksWithoutConversion})`,
          urgencyScore: -70,
        };
      }

      // Runaway CPA
      if (row.conversions > 0 && row.cpa > config.maxCPA && row.cost >= config.minSpendForHighCPA) {
        return {
          status: TRIAGE_STATUS.BLOCK,
          rule: 'Unprofitable High CPA',
          reason: `CPA of $${row.cpa.toFixed(2)} exceeds maximum limit of $${config.maxCPA.toFixed(2)}`,
          urgencyScore: -60,
        };
      }

      // Star Converter (Promote)
      if (row.conversions >= config.minConversionsForPromote && (row.cpa <= config.targetCPA * 1.15 || (row.conversionValue > 0 && row.roas >= config.targetROAS))) {
        return {
          status: TRIAGE_STATUS.PROMOTE,
          rule: 'Star Converter',
          reason: `${row.conversions} conv @ $${row.cpa.toFixed(2)} CPA${row.roas > 0 ? ` (${row.roas.toFixed(1)}x ROAS)` : ''}`,
          urgencyScore: 80,
        };
      }

      // High ROAS Performer
      if (row.conversions >= 1 && row.conversionValue > 0 && row.roas >= config.targetROAS * 1.25 && row.cost >= 15) {
        return {
          status: TRIAGE_STATUS.PROMOTE,
          rule: 'High ROAS Performer',
          reason: `${row.roas.toFixed(2)}x ROAS ($${row.conversionValue.toFixed(2)} revenue on $${row.cost.toFixed(2)} spend)`,
          urgencyScore: 85,
        };
      }

      // Default: Ignore
      return {
        status: TRIAGE_STATUS.IGNORE,
        rule: 'Inconclusive / Monitor',
        reason: row.conversions === 0 
          ? `Low sample: ${row.clicks} clicks ($${row.cost.toFixed(2)} spend). Below bleeder threshold.`
          : `Moderate performance: ${row.conversions} conv @ $${row.cpa ? row.cpa.toFixed(2) : '0'} CPA. Gather more data.`,
        urgencyScore: 0,
      };
    }

    function triageAll(rows, config) {
      let pCount = 0, bCount = 0, iCount = 0, oCount = 0;
      let totalSpend = 0, bleederSaved = 0, pSpend = 0, pConv = 0, pRev = 0, iSpend = 0;

      const triaged = rows.map(r => {
        const res = triageSingle(r, config);
        totalSpend += r.cost;
        if (res.overridden) oCount++;

        if (res.status === TRIAGE_STATUS.PROMOTE) {
          pCount++; pSpend += r.cost; pConv += r.conversions; pRev += r.conversionValue;
        } else if (res.status === TRIAGE_STATUS.BLOCK) {
          bCount++; bleederSaved += r.cost;
        } else {
          iCount++; iSpend += r.cost;
        }

        return { ...r, triageStatus: res.status, triageRule: res.rule, triageReason: res.reason, urgencyScore: res.urgencyScore, overridden: Boolean(res.overridden) };
      });

      return {
        triaged,
        summary: {
          totalQueries: rows.length,
          promoteCount: pCount,
          blockCount: bCount,
          ignoreCount: iCount,
          overriddenCount: oCount,
          totalSpend,
          bleederSpendSaved: bleederSaved,
          bleederSpendPercent: totalSpend > 0 ? (bleederSaved / totalSpend) * 100 : 0,
          promotedSpend: pSpend,
          promotedConversions: pConv,
          promotedCPA: pConv > 0 ? pSpend / pConv : 0,
          promotedROAS: pSpend > 0 ? pRev / pSpend : 0,
          ignoredSpend: iSpend,
        }
      };
    }

    function App() {
      const [rawRows, setRawRows] = useState([]);
      const [config, setConfig] = useState(DEFAULT_CONFIG);
      const [activeTab, setActiveTab] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [toast, setToast] = useState(null);
      const [isConfigOpen, setIsConfigOpen] = useState(false);
      const fileInputRef = useRef(null);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2500);
      };

      const { triaged, summary } = useMemo(() => {
        if (!rawRows.length) return { triaged: [], summary: null };
        return triageAll(rawRows, config);
      }, [rawRows, config]);

      const handleFileUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          try {
            const parsed = await parseGoogleAdsCSVText(ev.target.result);
            setRawRows(parsed);
            showToast(`Loaded ${parsed.length} queries from ${file.name}`);
          } catch (err) {
            alert('CSV parsing error: ' + err.message);
          }
        };
        reader.readAsText(file);
      };

      const handleLoadSample = async () => {
        const parsed = await parseGoogleAdsCSVText(SAMPLE_CSV);
        setRawRows(parsed);
        showToast(`Loaded ${parsed.length} sample search queries!`);
      };

      const handleOverride = (id, newStatus) => {
        setRawRows(prev => prev.map(r => r.id === id ? { ...r, userOverride: r.userOverride === newStatus ? null : newStatus } : r));
        showToast(`Updated query to ${newStatus.toUpperCase()}`);
      };

      const handleExportNegatives = () => {
        const blocked = triaged.filter(r => r.triageStatus === 'block');
        const csv = Papa.unparse(blocked.map(r => ({
          'Campaign': r.campaign,
          'Ad Group': r.adGroup,
          'Keyword': `[${r.query}]`,
          'Criterion Type': 'Negative Exact',
          'Wasted Spend': `$${r.cost.toFixed(2)}`,
          'Reason': r.triageReason
        })));
        downloadCSV(csv, 'google_ads_negatives.csv');
      };

      const handleExportPromoted = () => {
        const promoted = triaged.filter(r => r.triageStatus === 'promote');
        const csv = Papa.unparse(promoted.map(r => ({
          'Campaign': r.campaign,
          'Ad Group': r.adGroup,
          'Keyword': `[${r.query}]`,
          'Criterion Type': 'Exact',
          'Max CPC': `$${(r.avgCpc * 1.15).toFixed(2)}`,
          'Conversions': r.conversions,
          'CPA': `$${r.cpa ? r.cpa.toFixed(2) : 0}`,
          'Reason': r.triageReason
        })));
        downloadCSV(csv, 'google_ads_promoted_exact.csv');
      };

      const downloadCSV = (content, filename) => {
        const blob = new Blob([content], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      };

      const copyNegatives = () => {
        const blocked = triaged.filter(r => r.triageStatus === 'block');
        const txt = blocked.map(r => `[${r.query}]`).join('\n');
        navigator.clipboard.writeText(txt);
        showToast(`Copied ${blocked.length} negative keywords to clipboard!`);
      };

      const filtered = useMemo(() => {
        return triaged.filter(r => {
          if (activeTab === 'promote' && r.triageStatus !== 'promote') return false;
          if (activeTab === 'block' && r.triageStatus !== 'block') return false;
          if (activeTab === 'ignore' && r.triageStatus !== 'ignore') return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            return r.query.toLowerCase().includes(q) || (r.triageReason || '').toLowerCase().includes(q);
          }
          return true;
        });
      }, [triaged, activeTab, searchQuery]);

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-30">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/20">
                Ad
              </div>
              <div>
                <h1 className="text-lg font-bold text-white">Google Ads Query Triage</h1>
                <p className="text-xs text-slate-400">PapaParse Ingestion • Promote / Block / Ignore Decisions</p>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept=".csv" className="hidden" />
              <button onClick={() => fileInputRef.current?.click()} className="px-3.5 py-2 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 cursor-pointer">
                📁 Upload CSV
              </button>
              <button onClick={handleLoadSample} className="px-3.5 py-2 text-xs font-medium rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white cursor-pointer shadow-sm">
                ✨ Load Sample Data
              </button>
              {rawRows.length > 0 && (
                <>
                  <button onClick={copyNegatives} className="px-3 py-2 text-xs font-medium rounded-lg bg-rose-600/80 hover:bg-rose-500 text-white cursor-pointer">
                    📋 Copy Negatives
                  </button>
                  <button onClick={handleExportNegatives} className="px-3 py-2 text-xs font-medium rounded-lg bg-rose-700 hover:bg-rose-600 text-white cursor-pointer">
                    ⬇️ Negatives CSV
                  </button>
                  <button onClick={handleExportPromoted} className="px-3 py-2 text-xs font-medium rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white cursor-pointer">
                    ⬇️ Promoted CSV
                  </button>
                </>
              )}
            </div>
          </header>

          {/* Toast */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-800 border border-slate-700 px-4 py-2.5 rounded-xl shadow-2xl text-xs text-white">
              {toast}
            </div>
          )}

          {/* Main */}
          <main className="max-w-7xl w-full mx-auto p-6 flex-1 space-y-6">
            {!rawRows.length ? (
              <div className="text-center py-20 space-y-6 max-w-xl mx-auto">
                <div className="w-16 h-16 rounded-2xl bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 flex items-center justify-center mx-auto text-3xl">
                  📊
                </div>
                <h2 className="text-3xl font-extrabold text-white">Google Ads Query Triager</h2>
                <p className="text-sm text-slate-400">
                  Upload your Search Terms report to automatically segment queries into high-performing exact match candidates, 
                  budget bleeders to block, and low-volume queries to monitor.
                </p>
                <div className="flex justify-center gap-4 pt-2">
                  <button onClick={handleLoadSample} className="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-medium text-sm text-white shadow-lg cursor-pointer">
                    Load 40+ Preloaded Search Queries
                  </button>
                  <button onClick={() => fileInputRef.current?.click()} className="px-6 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 font-medium text-sm text-slate-200 cursor-pointer">
                    Upload CSV File
                  </button>
                </div>
              </div>
            ) : (
              <div className="space-y-6">
                {/* KPI Cards */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-4">
                    <span className="text-xs text-slate-400">Total Queries</span>
                    <div className="text-2xl font-bold text-white mt-1">{summary.totalQueries}</div>
                    <div className="text-xs text-slate-400 mt-1">Spend: ${summary.totalSpend.toFixed(2)}</div>
                  </div>

                  <div onClick={() => setActiveTab('promote')} className="bg-slate-900 border border-emerald-500/30 rounded-xl p-4 cursor-pointer hover:border-emerald-500/60">
                    <span className="text-xs text-emerald-400 font-semibold">🚀 Promote (Winners)</span>
                    <div className="text-2xl font-bold text-emerald-400 mt-1">{summary.promoteCount}</div>
                    <div className="text-xs text-emerald-300 mt-1">{summary.promotedConversions} conv @ ${summary.promotedCPA.toFixed(2)} CPA</div>
                  </div>

                  <div onClick={() => setActiveTab('block')} className="bg-slate-900 border border-rose-500/30 rounded-xl p-4 cursor-pointer hover:border-rose-500/60">
                    <span className="text-xs text-rose-400 font-semibold">🚫 Block (Bleeders)</span>
                    <div className="text-2xl font-bold text-rose-400 mt-1">{summary.blockCount}</div>
                    <div className="text-xs text-rose-300 font-bold mt-1">${summary.bleederSpendSaved.toFixed(2)} wasted spend saved</div>
                  </div>

                  <div onClick={() => setActiveTab('ignore')} className="bg-slate-900 border border-slate-800 rounded-xl p-4 cursor-pointer hover:border-slate-700">
                    <span className="text-xs text-amber-400 font-semibold">⏳ Ignore (Monitor)</span>
                    <div className="text-2xl font-bold text-slate-200 mt-1">{summary.ignoreCount}</div>
                    <div className="text-xs text-slate-400 mt-1">${summary.ignoredSpend.toFixed(2)} testing spend</div>
                  </div>
                </div>

                {/* Table */}
                <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
                  <div className="p-4 border-b border-slate-800 bg-slate-950/40 flex flex-wrap items-center justify-between gap-3">
                    <div className="flex gap-2 text-xs">
                      {['all', 'promote', 'block', 'ignore'].map(tab => (
                        <button
                          key={tab}
                          onClick={() => setActiveTab(tab)}
                          className={`px-3 py-1.5 rounded-lg capitalize font-medium cursor-pointer ${
                            activeTab === tab ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800'
                          }`}
                        >
                          {tab} {tab === 'promote' ? `(${summary.promoteCount})` : tab === 'block' ? `(${summary.blockCount})` : tab === 'ignore' ? `(${summary.ignoreCount})` : `(${summary.totalQueries})`}
                        </button>
                      ))}
                    </div>

                    <input
                      type="text"
                      placeholder="Search query or rule..."
                      value={searchQuery}
                      onChange={e => setSearchQuery(e.target.value)}
                      className="bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500 w-64"
                    />
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead>
                        <tr className="border-b border-slate-800 bg-slate-950/60 text-slate-400">
                          <th className="p-3">Search Term</th>
                          <th className="p-3">Decision</th>
                          <th className="p-3">Reason</th>
                          <th className="p-3 text-right">Spend</th>
                          <th className="p-3 text-right">Clicks</th>
                          <th className="p-3 text-right">Conversions</th>
                          <th className="p-3 text-right">CPA</th>
                          <th className="p-3 text-center">Override</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60">
                        {filtered.map(r => (
                          <tr key={r.id} className="hover:bg-slate-800/30">
                            <td className="p-3 font-medium text-slate-100">{r.query}</td>
                            <td className="p-3">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${
                                r.triageStatus === 'promote' ? 'bg-emerald-500/20 text-emerald-300' :
                                r.triageStatus === 'block' ? 'bg-rose-500/20 text-rose-300' : 'bg-slate-800 text-slate-300'
                              }`}>
                                {r.triageStatus}
                              </span>
                            </td>
                            <td className="p-3 text-slate-400 max-w-xs">{r.triageReason}</td>
                            <td className="p-3 text-right font-mono">${r.cost.toFixed(2)}</td>
                            <td className="p-3 text-right font-mono">{r.clicks}</td>
                            <td className="p-3 text-right font-mono font-bold text-emerald-400">{r.conversions}</td>
                            <td className="p-3 text-right font-mono">{r.cpa !== null ? `$${r.cpa.toFixed(2)}` : '--'}</td>
                            <td className="p-3 text-center">
                              <div className="inline-flex gap-1">
                                <button onClick={() => handleOverride(r.id, 'promote')} className="px-1.5 py-0.5 rounded bg-emerald-950 hover:bg-emerald-800 text-emerald-300 text-[10px] cursor-pointer">P</button>
                                <button onClick={() => handleOverride(r.id, 'block')} className="px-1.5 py-0.5 rounded bg-rose-950 hover:bg-rose-800 text-rose-300 text-[10px] cursor-pointer">B</button>
                                <button onClick={() => handleOverride(r.id, 'ignore')} className="px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] cursor-pointer">I</button>
                              </div>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
